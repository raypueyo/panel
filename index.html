<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Panel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<meta name="theme-color" content="#07090c">
<style>
  :root { --txt:#f4f7fb; --mut:rgba(244,247,251,.68); --up:#3ddc84; --down:#ff5c5c; --gold:#edbb00; --blau:#004d98; --grana:#a50044; --warn:#ffc261; --barh:9vh; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  textarea { -webkit-user-select:text; user-select:text; }
  html,body { height:100%; background:#07090c; color:var(--txt); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  button { font-family:inherit; border:none; cursor:pointer; color:inherit; background:none; }
  .err { color:var(--mut); font-size:2.4vh; padding:1vh 0; }

  /* ---------- Barra superior fija ---------- */
  #bar { position:relative; z-index:5; height:var(--barh); display:flex; align-items:center; justify-content:space-between; padding:0 2vw; background:#07090c; }
  .bl { display:flex; align-items:baseline; gap:1.2vw; }
  #time { font-size:6.2vh; font-weight:600; letter-spacing:-.01em; }
  #date { color:var(--mut); font-size:2.4vh; }
  .bc { display:flex; align-items:center; gap:1vw; }
  #scname { font-size:2.2vh; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--mut); min-width:12vw; text-align:right; }
  .dots { display:flex; gap:.6vw; }
  .dots button { width:2.2vh; height:2.2vh; border-radius:50%; background:rgba(255,255,255,.25); }
  .dots button.on { background:#fff; }
  #pause { font-size:2.2vh; color:var(--warn); min-width:2.5vw; }
  .br { display:flex; align-items:center; gap:1.4vw; font-size:2.4vh; color:var(--mut); }
  #minwx { color:var(--txt); font-weight:600; }
  #btc .up { color:var(--up); } #btc .down { color:var(--down); }
  #nbtn { background:rgba(255,255,255,.1); border-radius:20px; padding:.8vh 1.4vw; font-size:2.2vh; font-weight:600; }

  /* ---------- Escenas que rotan ---------- */
  #stage { position:relative; height:calc(100% - var(--barh)); overflow:hidden; touch-action:pan-y; }
  #track { display:flex; width:300vw; height:100%; transition:transform .8s ease; }
  .scene { position:relative; width:100vw; height:100%; overflow:hidden; }
  .scene.off * { animation-play-state:paused !important; }
  .bg { position:absolute; left:0; top:0; right:0; bottom:0; overflow:hidden; z-index:0; }
  .content { position:relative; z-index:1; height:100%; padding:2.4vh 2.4vw 3vh; }
  .glass { background:rgba(0,0,0,.28); border-radius:16px; }

  /* ===== Tiempo: cielo animado ===== */
  #sc-wx .bg { background:#2b6cb0; transition:background 2s; }
  #sc-wx.k-clear-day .bg   { background:linear-gradient(180deg,#1b5ea8,#4f95d8); }
  #sc-wx.k-part-day .bg    { background:linear-gradient(180deg,#2a5f98,#6b9ccb); }
  #sc-wx.k-clear-night .bg, #sc-wx.k-part-night .bg { background:linear-gradient(180deg,#060c22,#18264d); }
  #sc-wx.k-cloud .bg       { background:linear-gradient(180deg,#3b4a5e,#6d7c8f); }
  #sc-wx.k-rain .bg        { background:linear-gradient(180deg,#1b2737,#3c4c60); }
  #sc-wx.k-storm .bg       { background:linear-gradient(180deg,#141726,#33344a); }
  #sc-wx.k-snow .bg        { background:linear-gradient(180deg,#4a5b70,#9aaabb); }
  #sc-wx.k-fog .bg         { background:linear-gradient(180deg,#4c535c,#7f868e); }
  .sun { position:absolute; right:6vw; top:3vh; width:30vh; height:30vh; }
  .sun .rays { position:absolute; left:0; top:0; width:100%; height:100%; animation:spin 50s linear infinite; }
  .sun .core { position:absolute; left:25%; top:25%; width:50%; height:50%; border-radius:50%; background:#ffd34d; }
  .moon { position:absolute; right:8vw; top:5vh; width:22vh; height:22vh; }
  .cloud { position:absolute; left:0; opacity:.9; animation:drift linear infinite; }
  .cloud svg, .sun svg, .moon svg, .ball svg { display:block; width:100%; height:100%; }
  .drop { position:absolute; top:-12vh; width:2px; height:3vh; background:rgba(180,215,255,.55); animation:fall linear infinite; }
  .flake { position:absolute; top:-5vh; width:1vh; height:1vh; border-radius:50%; background:rgba(255,255,255,.85); animation:fall linear infinite; }
  .star { position:absolute; width:.5vh; height:.5vh; border-radius:50%; background:#fff; animation:twinkle 3s ease-in-out infinite alternate; }
  .fogband { position:absolute; left:-20vw; width:140vw; height:6vh; border-radius:6vh; background:rgba(255,255,255,.12); animation:sway 18s ease-in-out infinite alternate; }
  .flash { position:absolute; left:0; top:0; right:0; bottom:0; background:#fff; opacity:0; animation:flash 9s linear infinite; }
  @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  @keyframes drift { from { transform:translateX(-35vw); } to { transform:translateX(110vw); } }
  @keyframes fall { from { transform:translateY(0); } to { transform:translateY(105vh); } }
  @keyframes twinkle { from { opacity:.25; } to { opacity:1; } }
  @keyframes sway { from { transform:translateX(-6vw); } to { transform:translateX(6vw); } }
  @keyframes flash { 0%,95% { opacity:0; } 96% { opacity:.35; } 97% { opacity:0; } 98% { opacity:.2; } 100% { opacity:0; } }
  #sc-wx .content { display:flex; gap:2vw; }
  .wl { flex:1.15; display:flex; flex-direction:column; justify-content:center; min-width:0; }
  #temp { font-size:34vh; font-weight:200; line-height:.85; letter-spacing:-.05em; }
  #wxmain { font-size:4.4vh; font-weight:600; margin-top:1vh; }
  #temp, #wxmain, #wxsub { text-shadow:0 2px 14px rgba(0,20,50,.45); }
  #rainnow { display:inline-block; background:rgba(0,0,0,.35); color:#bfe0ff; border-radius:10px; padding:.2vh 1vw; margin-left:.8vw; font-size:2.6vh; font-weight:600; vertical-align:middle; }
  #wxsub { color:var(--mut); font-size:2.6vh; margin-top:.8vh; line-height:1.4; }
  .wr { flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:1.4vh; min-width:0; }
  .hours { display:flex; padding:1.2vh .6vw; }
  .hours > div { flex:1; text-align:center; }
  .hours .hh { color:var(--mut); font-size:2.1vh; }
  .hours .mi { width:5.2vh; height:5.2vh; margin:.5vh auto; }
  .hours .tt { font-size:3vh; font-weight:600; }
  .hours .pp { color:#bfe0ff; font-size:1.8vh; min-height:2vh; }
  .days { padding:.6vh 1.2vw; }
  .days > div { display:flex; align-items:center; gap:1vw; padding:.8vh 0; font-size:2.6vh; border-bottom:1px solid rgba(255,255,255,.1); }
  .days > div:last-child { border:none; }
  .days .mi { width:4.4vh; height:4.4vh; flex:none; }
  .days .dn { width:7vw; text-transform:capitalize; color:var(--mut); }
  .days .pp { margin-left:auto; color:#bfe0ff; font-size:2.2vh; }
  .mi svg { width:100%; height:100%; display:block; }

  /* ===== Partidos: césped ===== */
  #sc-par .bg { background:repeating-linear-gradient(90deg,#2f7d32 0,#2f7d32 10vw,#2a722e 10vw,#2a722e 20vw); }
  .pitch { position:absolute; left:2vw; top:2vh; right:2vw; bottom:2vh; opacity:.28; }
  .pitch svg { width:100%; height:100%; }
  .ball { position:absolute; width:7vh; height:7vh; }
  .ball.roll { bottom:.6vh; left:0; width:5vh; height:5vh; animation:roll 26s linear infinite; }
  .ball.still { right:3vw; top:3vh; width:9vh; height:9vh; opacity:.9; }
  @keyframes roll { from { transform:translateX(-12vw) rotate(0deg); } to { transform:translateX(108vw) rotate(1440deg); } }
  #sc-par .content { display:flex; flex-direction:column; }
  .chips { display:flex; gap:.8vw; margin-bottom:1.6vh; }
  .chips button { background:rgba(0,0,0,.3); border-radius:24px; padding:1vh 1.8vw; font-size:2.4vh; font-weight:700; }
  .chips button.on { background:#fff; color:#1d5e22; }
  #mlist { display:grid; grid-template-columns:1fr 1fr; gap:1.4vh 1.4vw; align-content:start; }
  .mc { background:rgba(6,30,10,.72); border-radius:14px; padding:1.2vh 1.2vw; text-align:left; border-left:5px solid transparent; }
  .mc.fcb { border-left-color:var(--grana); }
  .mc .top { display:flex; justify-content:space-between; font-size:1.9vh; color:var(--mut); }
  .mc .top .in { color:#ff8a8a; font-weight:700; }
  .mc .row { display:flex; align-items:center; gap:.8vw; margin-top:.6vh; font-size:2.8vh; font-weight:600; }
  .mc .row .t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mc .row .t.r { text-align:right; }
  .mc .row .s { flex:none; min-width:7vw; text-align:center; background:rgba(255,255,255,.12); border-radius:8px; padding:.2vh .6vw; font-weight:800; }
  .mc .tv { font-size:1.7vh; color:#bfe0ff; margin-top:.4vh; }
  .note { margin-left:auto; align-self:center; font-size:1.8vh; color:var(--mut); background:rgba(0,0,0,.3); border-radius:12px; padding:.6vh 1vw; }
  .dh { grid-column:1/-1; font-size:1.9vh; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#e8ffe9; margin-top:.4vh; }

  /* ===== Barça: azulgrana ===== */
  #sc-fcb .bg { background:#0a2a57; }
  #sc-fcb .photo { position:absolute; left:0; top:0; right:0; bottom:0; background-position:right center; background-size:contain; background-repeat:no-repeat; }
  #sc-fcb .tint { position:absolute; left:0; top:0; right:0; bottom:0; background:linear-gradient(90deg,#0a1a3a 0%,#0a1a3a 26%,rgba(10,26,58,.55) 33%,rgba(10,26,58,.2) 45%,rgba(4,10,26,.1) 100%); }
  .shine { position:absolute; top:-10vh; bottom:-10vh; width:18vw; background:rgba(255,255,255,.06); transform:skewX(-18deg); animation:shine 14s linear infinite; }
  @keyframes shine { from { transform:translateX(-30vw) skewX(-18deg); } to { transform:translateX(130vw) skewX(-18deg); } }
  #sc-fcb .content { display:flex; gap:1.6vw; }
  .fl { flex:1.25; display:flex; flex-direction:column; gap:1.4vh; min-width:0; }
  .fr { flex:1; display:flex; flex-direction:column; gap:1.4vh; min-width:0; }
  .panel { background:rgba(4,10,24,.76); border-radius:16px; padding:1.4vh 1.4vw; }
  .h3 { color:var(--gold); font-size:1.9vh; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin-bottom:.6vh; }
  #hero { text-align:left; width:100%; border-top:4px solid var(--gold); }
  #hero .vs { font-size:5.6vh; font-weight:800; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #hero .vs .sc { background:#fff; color:#0a2a57; border-radius:10px; padding:0 1vw; margin:0 .8vw; }
  #hero .when { font-size:2.8vh; margin-top:.6vh; }
  .cd { display:flex; gap:.8vw; margin-top:1.2vh; }
  .cd div { background:rgba(255,255,255,.1); border-radius:10px; padding:.6vh 1vw; text-align:center; min-width:7vw; }
  .cd b { display:block; font-size:4.6vh; font-weight:800; line-height:1.05; }
  .cd span { font-size:1.6vh; color:var(--mut); text-transform:uppercase; letter-spacing:.08em; }
  #hero .meta { font-size:1.8vh; color:var(--mut); margin-top:1vh; }
  #hero .meta .w { color:var(--warn); }
  .live { display:inline-block; background:var(--down); color:#fff; border-radius:6px; padding:0 .6vw; font-weight:800; animation:pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity:.55; } to { opacity:1; } }
  .nx > div { display:flex; gap:1vw; padding:.7vh 0; border-bottom:1px solid rgba(255,255,255,.1); font-size:2.3vh; }
  .nx > div:last-child { border:none; }
  .nx .d { width:16vw; flex:none; color:var(--mut); white-space:nowrap; }
  .nx .d b { color:var(--txt); }
  .nx .t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .nx .w { color:var(--warn); }
  .rs button { display:flex; width:100%; align-items:center; gap:.8vw; padding:.65vh 0; border-bottom:1px solid rgba(255,255,255,.1); font-size:2.2vh; text-align:left; }
  .rs button:last-child { border:none; }
  .rs .dd { width:6vw; color:var(--mut); flex:none; }
  .rs .t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .res { display:inline-block; width:3.4vh; text-align:center; border-radius:6px; font-weight:800; font-size:1.8vh; color:#07090c; flex:none; }
  .res.G { background:var(--up); } .res.E { background:#c3cad3; } .res.P { background:var(--down); }
  table { width:100%; border-collapse:collapse; font-size:2.1vh; }
  td { padding:.45vh .3vw; border-bottom:1px solid rgba(255,255,255,.08); white-space:nowrap; }
  td.n { text-align:right; } td.p { font-weight:800; }
  td.a { color:var(--mut); font-size:1.8vh; }
  tr.me td { background:rgba(165,0,68,.55); }

  /* ---------- Ficha de partido y notas (capas) ---------- */
  .ov { position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,.6); z-index:20; display:none; align-items:center; justify-content:center; }
  .ov.on { display:flex; }
  .card { width:82vw; max-height:88vh; background:#10151d; border-radius:20px; padding:2.4vh 2.4vw; overflow:hidden; display:flex; flex-direction:column; }
  .card .hd { display:flex; justify-content:space-between; align-items:center; color:var(--mut); font-size:2.2vh; }
  .score { display:flex; align-items:center; justify-content:center; gap:2vw; margin:1.6vh 0; font-size:4.6vh; font-weight:800; }
  .score .n { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .score .n.l { text-align:right; }
  .score .sc { background:#fff; color:#10151d; border-radius:12px; padding:.4vh 1.6vw; }
  .dt { display:flex; gap:2vw; min-height:0; flex:1; }
  .dt > div { flex:1; min-width:0; }
  .goals div { font-size:2.3vh; padding:.4vh 0; }
  .goals .a { color:var(--mut); font-size:1.9vh; }
  .stat { margin:.8vh 0; font-size:2vh; }
  .stat .lb { display:flex; justify-content:space-between; color:var(--mut); }
  .stat .bars { display:flex; height:1.2vh; border-radius:1vh; overflow:hidden; background:#2a313b; margin-top:.4vh; }
  .stat .bars i { display:block; height:100%; }
  .acts { display:flex; justify-content:flex-end; gap:1vw; margin-top:1.6vh; }
  .acts button { background:#2a313b; border-radius:24px; padding:1.2vh 2.4vw; font-size:2.4vh; font-weight:700; }
  .acts button.pri { background:var(--grana); }
  #notes { width:100%; flex:1; min-height:50vh; background:#1b2027; color:var(--txt); border:none; border-radius:14px; padding:2vh 1.6vw; font-size:3vh; font-family:inherit; resize:none; outline:none; }

  #fs { position:fixed; right:2vw; bottom:2vh; z-index:30; background:rgba(0,0,0,.6); color:var(--mut); border-radius:20px; padding:8px 14px; font-size:13px; }
  body.full #fs { display:none; }
  body.full { cursor:none; }
  #dim { position:fixed; left:0; top:0; right:0; bottom:0; background:#000; opacity:.5; pointer-events:none; display:none; z-index:40; }
  body.night #dim { display:block; }
  body.night * { animation-play-state:paused !important; }
  body.rest .scene * { animation-play-state:paused !important; }

<div id="fs">Toca para pantalla completa</div>
<div id="dim"></div>

<div id="bar">
  <div class="bl"><span id="time">--:--</span><span id="date"></span></div>
  <div class="bc"><span id="pause"></span><span id="scname"></span><div class="dots" id="dots"></div></div>
  <div class="br"><span id="minwx">--°</span><span id="btc">BTC …</span><button id="nbtn" onclick="openNotes()">✎ Notas</button></div>
</div>

<div id="stage"><div id="track">

  <!-- ESCENA 1: TIEMPO -->
  <section class="scene" id="sc-wx">
    <div class="bg" id="sky"></div>
    <div class="content">
      <div class="wl">
        <div id="temp">--°</div>
        <div id="wxmain">Cargando el tiempo…</div>
        <div id="wxsub"></div>
      </div>
      <div class="wr">
        <div class="glass hours" id="hours"></div>
        <div class="glass days" id="days"></div>
      </div>
    </div>
  </section>

  <!-- ESCENA 2: PARTIDOS -->
  <section class="scene off" id="sc-par">
    <div class="bg">
      <div class="pitch"><svg viewBox="0 0 1000 600" preserveAspectRatio="none" fill="none" stroke="#fff" stroke-width="4"><rect x="4" y="4" width="992" height="592"/><line x1="500" y1="4" x2="500" y2="596"/><circle cx="500" cy="300" r="80"/><rect x="4" y="160" width="140" height="280"/><rect x="856" y="160" width="140" height="280"/><rect x="4" y="235" width="50" height="130"/><rect x="946" y="235" width="50" height="130"/></svg></div>
      <div class="ball still" id="ball1"></div>
      <div class="ball roll" id="ball2"></div>
    </div>
    <div class="content">
      <div class="chips">
        <button id="ch-3" class="on" onclick="day(3)">3 días</button>
        <button id="ch-0" onclick="day(0)">Hoy</button>
        <button id="ch-1" onclick="day(1)">Mañana</button>
        <button id="ch-2" onclick="day(2)">Pasado</button>
        <span class="note">Toca un partido para ver la ficha · 📺 orientativo</span>
      </div>
      <div id="mlist"><div class="err">Cargando…</div></div>
    </div>
  </section>

  <!-- ESCENA 3: BARÇA -->
  <section class="scene off" id="sc-fcb">
    <div class="bg"><div class="photo" id="campnou"></div><div class="tint"></div><div class="shine"></div></div>
    <div class="content">
      <div class="fl">
        <button class="panel" id="hero" onclick="heroTap()"><div class="err">Cargando…</div></button>
        <div class="panel"><div class="h3">Próximos</div><div class="nx" id="next"></div></div>
      </div>
      <div class="fr">
        <div class="panel"><div class="h3">Últimos resultados</div><div class="rs" id="results"><div class="err">Cargando…</div></div></div>
        <div class="panel"><div class="h3">La Liga</div><div id="table"><div class="err">Cargando…</div></div></div>
        <div class="panel"><div class="h3">Pichichi · La Liga</div><div id="pichichi"><div class="err">Cargando…</div></div></div>
      </div>
    </div>
  </section>

</div></div>

<!-- Ficha de partido -->

  <div class="acts"><button class="pri" onclick="closeNotes()">Listo</button></div>
</div></div>

<script>
/* ====== CONFIGURACIÓN (edita aquí) ====== */
var CFG = {
  city: "Barcelona", lat: 41.3874, lon: 2.1686,
  tz: "Europe/Madrid",
  pairs: [["XBTUSD","BTC"]],            // solo se muestra el primero, en pequeño
  // Competiciones: [código ESPN, nombre, dónde se ve en España (ORIENTATIVO, no es dato real)]
  leagues: [
    ["esp.1","La Liga","DAZN / Movistar+"],
    ["uefa.champions","Champions","Movistar+"],
    ["uefa.europa","Europa League","Movistar+"],
    ["esp.copa_del_rey","Copa del Rey","RTVE / Movistar+"]
  ],
  barcaEspnId: "83",
  barcaLeagues: ["esp.1","uefa.champions"],
  rotateSec: 15,        // segundos por escena
  pauseSec: 120,        // al tocar, la rotación se para este tiempo
  night: [1,7],         // atenuar y parar animaciones de 1:00 a 7:00 (null = nunca)
  motionSec: 12,        // segundos de movimiento tras cada cambio de escena (0 = movimiento siempre)
  tableRows: 6,         // filas de la clasificación (+ el Barça si no entra)
  scorers: 5            // goleadores en el Pichichi
};
/* ======================================== */

function $(id){ return document.getElementById(id); }
function get(url, cb, err){
  var x = new XMLHttpRequest();
  x.open("GET", url, true);
  x.timeout = 20000;
  x.onload = function(){ try { cb(JSON.parse(x.responseText)); } catch(e){ err && err(e); } };
  x.onerror = x.ontimeout = function(){ err && err(new Error("red")); };
  x.send();
}
function pad(n){ return n<10 ? "0"+n : ""+n; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function fmt(d, o){ o.timeZone = CFG.tz; return d.toLocaleString("es-ES", o); }
function hm(d){ return fmt(d,{hour:"2-digit",minute:"2-digit"}); }
function ymdTz(d){ return d.toLocaleDateString("sv-SE",{timeZone:CFG.tz}); }
function short(n){ return String(n||"").replace(/^FC /,"").replace("Barcelona","Barça"); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function madrid(ymd, hhmm){
  var p = ymd.split("-"), h = (hhmm||"12:00").split(":");
  var guess = Date.UTC(+p[0], +p[1]-1, +p[2], +h[0], +h[1]);
  var s = new Date(guess).toLocaleString("en-US",{timeZone:CFG.tz,hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  var m = s.match(/(\d+)\/(\d+)\/(\d+),?\s+(\d+):(\d+)/);
  var loc = Date.UTC(+m[3], +m[1]-1, +m[2], (+m[4])%24, +m[5]);
  return new Date(guess - (loc - guess));
}
function setCls(el, cls, on){ var c = " "+el.className+" "; c = c.replace(" "+cls+" "," "); el.className = (c + (on ? cls : "")).replace(/^\s+|\s+$/g,""); }

/* ---------- Reloj y modo noche ---------- */
function tick(){
  var d = new Date();
  $("time").textContent = hm(d);
  $("date").textContent = cap(fmt(d,{weekday:"long",day:"numeric",month:"long"}));
  if(CFG.night){
    var h = +fmt(d,{hour:"2-digit",hour12:false}) % 24;
    setCls(document.body, "night", h >= CFG.night[0] && h < CFG.night[1]);
  }
}
setInterval(tick,1000); tick();

/* ---------- Rotación de escenas ---------- */
var SC = [["sc-wx","Tiempo"],["sc-par","Partidos"],["sc-fcb","Barça"]], CUR = 0, pausedUntil = 0, PIN = false;
(function(){ var h=""; for(var i=0;i<SC.length;i++) h += '<button onclick="go('+i+',true)"></button>'; $("dots").innerHTML = h; })();
function go(i, user){
  CUR = (i + SC.length) % SC.length;
  $("track").style.transform = "translateX(-"+(CUR*100)+"vw)";
  for(var k=0;k<SC.length;k++){ setCls($(SC[k][0]), "off", k!==CUR); $("dots").children[k].className = k===CUR ? "on" : ""; }
  $("scname").textContent = SC[CUR][1];
  if(user) touched();
  setCls(document.body, "rest", false);
  clearTimeout(go._t);
  if(CFG.motionSec) go._t = setTimeout(function(){ setCls(document.body, "rest", true); }, CFG.motionSec*1000);
}
function touched(){ pausedUntil = Date.now() + CFG.pauseSec*1000; $("pause").textContent = "⏸"; }
setInterval(function(){
  if(Date.now() < pausedUntil || $("ov").className.indexOf("on")>-1 || $("notesov").className.indexOf("on")>-1) return;
  $("pause").textContent = "";
  if(PIN){ if(CUR!==2) go(2); return; }
  go(CUR+1);
}, CFG.rotateSec*1000);
go(0);
/* Deslizar con el dedo */
(function(){
  var x0 = null, y0 = 0;
  $("stage").addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  $("stage").addEventListener("touchend", function(e){
    if(x0===null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(CUR + (dx<0 ? 1 : -1), true);
  }, {passive:true});
})();
document.addEventListener("click", function(){ if(document.fullscreenElement || document.webkitFullscreenElement) touched(); }, true);

/* ---------- Iconos y cielo animado ---------- */
function kindOf(code, day){
  if(code===0||code===1) return day ? "clear-day" : "clear-night";
  if(code===2) return day ? "part-day" : "part-night";
  if(code===3) return "cloud";
  if(code===45||code===48) return "fog";

    var ent = (j.children && j.children[0] && j.children[0].standings.entries) || [];
    if(!ent.length){ $("table").innerHTML = '<div class="err">Sin datos</div>'; return; }
    var rows = ent.map(function(x){ var o = {id:x.team.id, n:short(x.team.shortDisplayName||x.team.displayName)}; x.stats.forEach(function(s){ o[s.name] = s.displayValue; }); return o; });
    rows.sort(function(a,b){ return (+a.rank)-(+b.rank); });
    var show = rows.slice(0, CFG.tableRows), fcb = null;
    rows.forEach(function(r){ if(r.id===CFG.barcaEspnId) fcb = r; });
    if(fcb && show.indexOf(fcb)<0) show.push(fcb);
    $("table").innerHTML = '<table>'+show.map(function(r){
      return '<tr'+(r.id===CFG.barcaEspnId?' class="me"':'')+'><td class="n">'+r.rank+'</td><td>'+esc(r.n)+'</td><td class="n">'+r.gamesPlayed+' PJ</td><td class="n">'+r.pointDifferential+'</td><td class="n p">'+r.points+' pts</td></tr>';
    }).join("")+'</table>';
  }, function(){ $("table").innerHTML = '<div class="err">Sin conexión con ESPN</div>'; });
}
/* Pichichi: máximos goleadores de La Liga (ESPN) */
function pichichi(){
  get(ESPN+"esp.1/statistics", function(j){
    var cat = (j.stats||[]).filter(function(c){ return c.name==="goalsLeaders"; })[0];
    var L = (cat && cat.leaders) || [];
    if(!L.length){ $("pichichi").innerHTML = '<div class="err">Sin datos</div>'; return; }
    $("pichichi").innerHTML = '<table>'+L.slice(0, CFG.scorers).map(function(l){
      var a = l.athlete || {}, t = a.team || {}, g = Math.round(l.value||0);
      var pos = 1; L.forEach(function(o){ if((o.value||0) > (l.value||0)) pos++; });
      var as = (String(l.shortDisplayValue||"").match(/A:\s*(\d+)/)||[])[1];
      return '<tr'+(t.id===CFG.barcaEspnId?' class="me"':'')+'><td class="n">'+pos+'</td><td>'+esc(a.displayName||"")+'</td><td class="a">'+esc(short(t.displayName||""))+'</td><td class="n a">'+(as!=null?as+" asist.":"")+'</td><td class="n p">'+g+' ⚽</td></tr>';
    }).join("")+'</table>';
  }, function(){ $("pichichi").innerHTML = '<div class="err">Sin conexión con ESPN</div>'; });
}
drawHero(); drawNext(); barcaEspn(); table(); pichichi();
setInterval(pichichi, 60*60*1000);
setInterval(function(){ drawHero(); drawNext(); }, 30*1000);
setInterval(barcaEspn, 30*60*1000);
setInterval(table, 60*60*1000);

/* ---------- Ficha de partido (ESPN summary) ---------- */
var OVLINK = "";
function linkOf(e){ var l = (e.links||[]).filter(function(x){ return /espn\.com\/soccer\/match/.test(x.href); })[0]; return l ? l.href : "https://www.espn.com/soccer/match/_/gameId/"+e.id; }
function openMatch(id){
  var e = EV[id]; if(!e) return;
  var s = sides(e), st = stOf(e), h = s.home, a = s.away;
  OVLINK = linkOf(e);
  var head = '<div class="hd"><span>'+esc(e._l||"")+' · '+cap(fmt(new Date(e.date),{weekday:"long",day:"numeric",month:"long"}))+' · '+hm(new Date(e.date))+'</span><span>'+(st.state==="in" ? '<span class="live">EN DIRECTO</span> '+esc(st.shortDetail||"") : st.state==="post" ? "Final" : "Sin empezar")+'</span></div>';
  var score = '<div class="score"><span class="n l">'+esc(tname(h))+'</span><span class="sc">'+(st.state==="pre" ? "vs" : scoreOf(h)+" – "+scoreOf(a))+'</span><span class="n">'+esc(tname(a))+'</span></div>';
  var acts = '<div class="acts"><button onclick="openWeb()">Abrir en ESPN ↗</button><button class="pri" onclick="closeOv()">Cerrar</button></div>';
  $("ovcard").innerHTML = head + score + '<div class="dt" id="ovdt"><div class="err">Cargando ficha…</div></div>' + acts;
  $("ov").className = "ov on";
  get(ESPN+(e._code||"esp.1")+"/summary?event="+id, function(m){
    var goals = { }, H = h.team.id;
    goals[H] = []; goals[a.team.id] = [];
    (m.keyEvents||[]).forEach(function(k){
      var t = k.team && k.team.id, tx = (k.type && k.type.text) || "", who = (k.participants||[]).map(function(p){ return p.athlete && p.athlete.displayName; });
      if(!goals[t]) return;
      if(k.scoringPlay) goals[t].push('<div>⚽ '+esc(k.clock && k.clock.displayValue)+' <b>'+esc(who[0]||"")+'</b>'+(who[1] ? '<div class="a">asist. '+esc(who[1])+'</div>' : "")+(/own/i.test(tx)?' <span class="a">(p.p.)</span>':'')+(/penalty/i.test(tx)?' <span class="a">(pen.)</span>':'')+'</div>');
      else if(/red card/i.test(tx)) goals[t].push('<div>🟥 '+esc(k.clock && k.clock.displayValue)+' '+esc(who[0]||"")+'</div>');
    });
    var stats = { }, bt = (m.boxscore && m.boxscore.teams) || [];
    bt.forEach(function(t){ var o = {}; (t.statistics||[]).forEach(function(x){ o[x.name] = parseFloat(x.displayValue)||0; }); stats[t.team.id] = o; });
    var sh = stats[H] || {}, sa = stats[a.team.id] || {};
    function bar(lab, key){
      var x = sh[key]||0, y = sa[key]||0, t = x+y;
      if(!t) return "";
      return '<div class="stat"><div class="lb"><b>'+x+(key==="possessionPct"?"%":"")+'</b><span>'+lab+'</span><b>'+y+(key==="possessionPct"?"%":"")+'</b></div><div class="bars"><i style="width:'+(x/t*100)+'%;background:#4f95d8"></i><i style="width:'+(y/t*100)+'%;background:#ff7b8a"></i></div></div>';
    }
    var gi = m.gameInfo || {}, venue = gi.venue ? esc(gi.venue.fullName)+(gi.attendance ? " · "+Number(gi.attendance).toLocaleString("es-ES")+" espectadores" : "") : "";
    var col1 = '<div class="goals"><div class="h3">'+esc(tname(h))+'</div>'+(goals[H].join("")||'<div class="a">—</div>')+'<div class="h3" style="margin-top:1vh">'+esc(tname(a))+'</div>'+(goals[a.team.id].join("")||'<div class="a">—</div>')+'</div>';
    var col2 = '<div>'+bar("Posesión","possessionPct")+bar("Tiros","totalShots")+bar("A puerta","shotsOnTarget")+bar("Córners","wonCorners")+bar("Amarillas","yellowCards")+(venue ? '<div class="stat"><div class="lb"><span>🏟 '+venue+'</span></div></div>' : "")+'</div>';
    if(st.state==="pre") $("ovdt").innerHTML = '<div><div class="h3">Previa</div><div class="goals"><div>'+(venue||"Estadio por confirmar")+'</div><div class="a">La ficha se completa cuando empiece el partido.</div></div></div>';
    else $("ovdt").innerHTML = col1 + col2;
  }, function(){ $("ovdt").innerHTML = '<div class="err">No se pudo cargar la ficha (ESPN)</div>'; });
}
function closeOv(){ $("ov").className = "ov"; }
function openWeb(){ if(OVLINK) window.open(OVLINK, "_blank"); }

/* ---------- Notas ---------- */
(function(){
  var t = $("notes");
  try { t.value = localStorage.getItem("panel_notas") || ""; } catch(e){}
  t.addEventListener("input", function(){ try { localStorage.setItem("panel_notas", t.value); } catch(e){} });

function openNotes(){ $("notesov").className = "ov on"; }
function closeNotes(){ $("notesov").className = "ov"; $("notes").blur(); }

/* Abrir una escena desde la dirección (#tiempo, #partidos, #barca) — útil para pruebas */
(function(){ var h = (location.hash||"").replace("#",""); if(h==="partidos"){ go(1); touched(); } if(h==="barca"){ go(2); touched(); } })();

/* ---------- Mantener la pantalla encendida (refuerzo, si el navegador lo permite) ---------- */
var WL = null;
function keepAwake(){
  try {
    if(navigator.wakeLock && !WL){
      navigator.wakeLock.request("screen").then(function(l){ WL = l; l.addEventListener("release", function(){ WL = null; }); }).catch(function(){});
    }
  } catch(x){}
}
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible") keepAwake(); });
document.addEventListener("click", keepAwake, true);
keepAwake();

/* ---------- Pantalla completa al tocar ---------- */
function goFull(){
  var e = document.documentElement, f = e.requestFullscreen || e.webkitRequestFullscreen;
  if(f){ try { var r = f.call(e); if(r && r.catch) r.catch(function(){}); } catch(x){} }
  try { screen.orientation.lock("landscape").catch(function(){}); } catch(x){}
}
function fsState(){ setCls(document.body, "full", !!(document.fullscreenElement || document.webkitFullscreenElement)); }
/* Abierto como app desde la pantalla de inicio (iPad/Android): ya está a pantalla completa */
if(window.navigator.standalone || (window.matchMedia && (matchMedia("(display-mode: fullscreen)").matches || matchMedia("(display-mode: standalone)").matches))){ setCls(document.body, "full", true); }
document.addEventListener("fullscreenchange", fsState);
document.addEventListener("webkitfullscreenchange", fsState);
/* El primer toque solo activa la pantalla completa (no abre fichas ni cambia nada) */
document.addEventListener("click", function(e){
  if(!document.fullscreenElement && !document.webkitFullscreenElement && document.activeElement!==$("notes")){
    goFull(); e.stopPropagation(); e.preventDefault();
  }
}, true);
</script>
