name: Estrenos del mes
on:
  schedule:
    - cron: "15 5 * * *"   # cada día a las 7:15 (hora de Madrid en verano)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/estrenos.py
      - run: |
          git config user.name "panel-bot"
          git config user.email "panel-bot@users.noreply.github.com"
          git add estrenos.json
          git diff --cached --quiet || git commit -m "Estrenos actualizados"
          git push
